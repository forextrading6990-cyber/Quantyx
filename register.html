<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quantyx - Unlock Unlimited Potential! 📈
Join a platform that never closes & earn steady income by inviting subordinates with 16%:3%:2% commission ratio on team benefits. Get bonuses with every recharge, register for lucky prizes & take control of your financial future!
✅ Task update ✅ 24-hour reset ✅ 
Grow your network, grow your earnings and uncover the potential within you!!!
    <title>Quantyx Intel™- Login</title>
    <link rel="icon" type="quantyx.png" href="quantyx.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a0033 0%, #330066 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .shape {
            position: absolute;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }

        .shape:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            top: 60%;
            left: 80%;
            animation-delay: 5s;
        }

        .shape:nth-child(3) {
            top: 30%;
            left: 60%;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0, 255, 255, 0.3);
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-name {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .app-subtitle {
            color: #00ffff;
            font-size: 14px;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-switcher {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #00ffff, #0099ff);
            box-shadow: 0 4px 15px rgba(0, 255, 255, 0.4);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            color: #00ffff;
            font-size: 13px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: #00ffff;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 15px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"] {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        [dir="rtl"] input[type="text"],
        [dir="rtl"] input[type="email"],
        [dir="rtl"] input[type="password"],
        [dir="rtl"] input[type="tel"] {
            padding: 15px 45px 15px 15px;
            text-align: right;
        }

        input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            width: 20px;
            height: 20px;
            fill: #00ffff;
        }

        [dir="rtl"] .toggle-password {
            right: auto;
            left: 15px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            cursor: pointer;
        }

        [dir="rtl"] input[type="checkbox"] {
            margin-right: 0;
            margin-left: 8px;
        }

        .checkbox-label {
            color: #fff;
            font-size: 13px;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b35, #ff00ff);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 0, 255, 0.4);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 255, 0.6);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #ccff00, #00ff88);
            color: #1a0033;
            box-shadow: 0 4px 15px rgba(204, 255, 0, 0.4);
        }

        .btn-secondary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(204, 255, 0, 0.6);
        }

        .btn-google {
            background: #fff;
            color: #333;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        .btn-google:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn-primary .spinner {
            border-top-color: #fff;
        }

        .btn-secondary .spinner {
            border-top-color: #1a0033;
        }

        .btn-google .spinner {
            border-top-color: #333;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #888;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 15px;
        }

        .link {
            color: #00ffff;
            text-decoration: none;
            font-size: 13px;
            display: block;
            text-align: center;
            margin: 15px 0;
            transition: color 0.3s ease;
        }

        .link:hover {
            color: #ff00ff;
        }

        .language-selector {
            margin-top: 20px;
            text-align: center;
        }

        select {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
        }

        .password-strength {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s ease;
        }

        .strength-weak { background: #ff6b6b; width: 33%; }
        .strength-medium { background: #ffd93d; width: 66%; }
        .strength-strong { background: #6bcf7f; width: 100%; }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 9999;
            display: none;
            animation: slideIn 0.3s ease;
            max-width: 350px;
        }

        [dir="rtl"] .notification {
            right: auto;
            left: 20px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        [dir="rtl"] @keyframes slideIn {
            from {
                transform: translateX(-400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }

        .notification.error {
            background: linear-gradient(135deg, #ff6b6b, #ff0000);
        }

        .notification.success {
            background: linear-gradient(135deg, #6bcf7f, #00ff88);
        }

        .notification.info {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .notification.show {
            display: block;
        }

        .notification.hide {
            animation: slideOut 0.3s ease;
        }

        .password-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .password-modal.active {
            display: flex;
        }

        .password-modal-content {
            background: linear-gradient(135deg, #1a0033, #330066);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .password-modal-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #00ffff;
        }

        .password-modal-subtitle {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 25px;
        }

        .password-modal .input-group {
            text-align: left;
        }

        [dir="rtl"] .password-modal .input-group {
            text-align: right;
        }

        .password-modal .btn {
            margin-top: 10px;
        }

        .close-modal-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 10px;
        }

        .close-modal-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            .form-container {
                padding: 20px;
            }
            .notification {
                right: 10px;
                left: 10px;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <svg class="shape" width="100" height="100" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="40" fill="#00ffff"/>
        </svg>
        <svg class="shape" width="120" height="120" viewBox="0 0 100 100">
            <rect x="10" y="10" width="80" height="80" fill="#ff00ff"/>
        </svg>
        <svg class="shape" width="90" height="90" viewBox="0 0 100 100">
            <polygon points="50,10 90,90 10,90" fill="#ccff00"/>
        </svg>
    </div>

    <div id="notification" class="notification"></div>

    <div class="password-modal" id="passwordModal">
        <div class="password-modal-content">
            <div class="password-modal-title" data-i18n="setPassword">Set Your Password</div>
            <div class="password-modal-subtitle" data-i18n="createStrongPassword">Create a strong password to secure your account</div>
            
            <form id="google-password-form" onsubmit="completeGoogleSignUp(event)">
                <div class="input-group">
                    <label class="input-label" data-i18n="createPassword">Create Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                        <input type="password" id="google-password" data-i18n-placeholder="enterStrongPassword" placeholder="Enter strong password (min 6 chars)" minlength="6" required oninput="checkGooglePasswordStrength(this.value)">
                        <svg class="toggle-password" viewBox="0 0 24 24" onclick="togglePassword('google-password')">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </div>
                    <div class="password-strength">
                        <div class="password-strength-bar" id="google-strength-bar"></div>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label" data-i18n="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                        <input type="password" id="google-confirm-password" data-i18n-placeholder="confirmPasswordPlaceholder" placeholder="Confirm password" minlength="6" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-secondary" id="google-submit-btn">
                    <span class="btn-text" data-i18n="completeRegistration">Complete Registration</span>
                </button>
                <button type="button" class="btn close-modal-btn" onclick="closePasswordModal()" data-i18n="cancel">Cancel</button>
            </form>
        </div>
    </div>

    <div class="container">
        <div class="logo-container">
            <div class="logo">
                <img src="quantyx.png" alt="Quantyx Logo">
            </div>
            <h1 class="app-name">Quantyx Intel™</h1>
            <p class="app-subtitle" data-i18n="appSubtitle">Premium USDT Patform</p>
        </div>

        <div class="form-container">
            <div class="tab-switcher">
                <button class="tab-btn active" onclick="switchTab('login')" data-i18n="login">Login</button>
                <button class="tab-btn" onclick="switchTab('register')" data-i18n="register">Register</button>
            </div>

            <div id="login-section" class="form-section active">
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label class="input-label" data-i18n="email">Email</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24">
                                <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                            </svg>
                            <input type="email" id="login-email" data-i18n-placeholder="enterEmail" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" data-i18n="password">Password</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24">
                                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                            </svg>
                            <input type="password" id="login-password" data-i18n-placeholder="enterPassword" placeholder="Enter password" required>
                            <svg class="toggle-password" viewBox="0 0 24 24" onclick="togglePassword('login-password')">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            </svg>
                        </div>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="remember-me">
                        <label class="checkbox-label" for="remember-me" data-i18n="rememberMe">Remember me</label>
                    </div>

                    <button type="submit" class="btn btn-primary" id="login-btn">
                        <span class="btn-text" data-i18n="login">Login</span>
                    </button>
                    <a href="#" class="link" onclick="switchTab('forgot'); return false;" data-i18n="forgotPassword">Forgot Password?</a>
                </form>
            </div>

            <div id="register-section" class="form-section">
                <button type="button" class="btn btn-google" id="google-signup-btn" onclick="handleGoogleSignUp()">
                    <svg class="google-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span class="btn-text" data-i18n="signUpGoogle">Sign up with Google</span>
                </button>
                
                <div class="divider">
                    <span data-i18n="or">OR</span>
                </div>

                <form id="register-form" onsubmit="handleRegister(event)">
                    <div class="input-group">
                        <label class="input-label" data-i18n="email">Email</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24">
                                <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                            </svg>
                            <input type="email" id="register-email" data-i18n-placeholder="enterEmail" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" data-i18n="username">Username</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24">
                                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                            </svg>
                            <input type="text" id="register-username" data-i18n-placeholder="chooseUsername" placeholder="Choose username" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" data-i18n="password">Password</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24">

        const rtlLanguages = ['ar', 'fa', 'ur'];
        let currentLanguage = localStorage.getItem('selectedLanguage') || 'en';

        function applyTranslations(lang) {
            const t = translations[lang] || translations.en;
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    el.textContent = t[key];
                }
            });
            
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) {
                    el.placeholder = t[key];
                }
            });
            
            if (rtlLanguages.includes(lang)) {
                document.documentElement.setAttribute('dir', 'rtl');
                document.documentElement.setAttribute('lang', lang);
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
                document.documentElement.setAttribute('lang', lang);
            }
            
            document.getElementById('language-select').value = lang;
            localStorage.setItem('selectedLanguage', lang);
            currentLanguage = lang;
        }

        function getTranslation(key) {
            const t = translations[currentLanguage] || translations.en;
            return t[key] || translations.en[key] || key;
        }

        window.changeLanguage = function(lang) {
            applyTranslations(lang);
        };

        document.addEventListener('DOMContentLoaded', function() {
            applyTranslations(currentLanguage);
            
            // Handle referral link: #register?ref=XXXXX
            handleReferralLink();
        });
        
        function handleReferralLink() {
            const hash = window.location.hash;
            const fullUrl = window.location.href;
            let referralCode = null;
            
            // Check for #register?ref=XXXXX format
            if (hash.includes('/login')) {
                const hashParts = hash.split('?');
                if (hashParts.length > 1) {
                    const params = new URLSearchParams(hashParts[1]);
                    referralCode = params.get('ref');
                }
            }
            
            // Also check for regular query params ?ref=XXXXX
            const urlParams = new URLSearchParams(window.location.search);
            if (!referralCode) {
                referralCode = urlParams.get('ref');
            }
            
            // If referral code found, handle it
            if (referralCode) {
                // Store referral code for later use (both keys for compatibility)
                localStorage.setItem('pendingReferralCode', referralCode);
                localStorage.setItem('referredByCode', referralCode);
                
                // Switch to register tab
                setTimeout(() => {
                    switchToRegisterWithReferral(referralCode);
                }, 500);
            }
        }
        
        function switchToRegisterWithReferral(referralCode) {
            // Switch to register tab
            const tabs = document.querySelectorAll('.tab-btn');
            const sections = document.querySelectorAll('.form-section');
            
            tabs.forEach(t => t.classList.remove('active'));
            sections.forEach(s => s.classList.remove('active'));
            
            if (tabs.length > 1) tabs[1].classList.add('active');
            document.getElementById('register-section').classList.add('active');
            
            // Fill in the referral code
            const inviteCodeInput = document.getElementById('invite-code');
            if (inviteCodeInput) {
                inviteCodeInput.value = referralCode;
            }
            
            // Show the "Invited by" notification
            showReferralNotification(referralCode);
        }
        
        function showReferralNotification(referralCode) {
            const notification = document.getElementById('notification');
            notification.innerHTML = '<span style="display: flex; align-items: center; gap: 8px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg> Invited by ' + referralCode + '</span>';
            notification.className = 'notification info show';
            
            // Keep visible longer for referral notifications
            setTimeout(() => {
                notification.classList.add('hide');
                setTimeout(() => {
                    notification.classList.remove('show', 'hide');
                }, 300);
            }, 5000);
        }
        
        window.switchToRegisterWithReferral = switchToRegisterWithReferral;
    </script>

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;
            
            setTimeout(() => {
                notification.classList.add('hide');
                setTimeout(() => {
                    notification.classList.remove('show', 'hide');
                }, 300);
            }, 3000);
        }

        function setButtonLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            
            const btnText = btn.querySelector('.btn-text');
            let spinner = btn.querySelector('.spinner');
            
            if (loading) {
                btn.disabled = true;
                if (btnText) btnText.style.display = 'none';
                if (!spinner) {
                    spinner = document.createElement('div');
                    spinner.className = 'spinner';
                    btn.appendChild(spinner);
                }
            } else {
                btn.disabled = false;
                if (btnText) btnText.style.display = 'inline';
                if (spinner) spinner.remove();
            }
        }

        window.setButtonLoading = setButtonLoading;

        function checkSession() {
            const userData = JSON.parse(localStorage.getItem('luxeEarnUser') || 'null');
            if (userData && userData.isLoggedIn) {
                const loginTime = new Date(userData.loginTime);
                const now = new Date();
                const hoursDiff = (now - loginTime) / (1000 * 60 * 60);
                
                if (hoursDiff < 24) {
                    window.location.href = '/index';
                } else {
                    localStorage.removeItem('luxeEarnUser');
                    showNotification(getTranslation('sessionExpired'), 'error');
                }
            }
        }

        checkSession();

        window.handleLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const remember = document.getElementById('remember-me').checked;

            setButtonLoading('login-btn', true);

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                const userData = {
                    email: user.email,
                    uid: user.uid,
                    isLoggedIn: true,
                    loginTime: new Date().toISOString()
                };
                
                localStorage.setItem('luxeEarnUser', JSON.stringify(userData));
                localStorage.setItem('userEmail', user.email);
                if (remember) {
                    localStorage.setItem('rememberMe', 'true');
                }
                
                showNotification(`${getTranslation('welcomeBack')} ${user.email}`, 'success');
                setTimeout(() => {
                    window.location.href = '/index';
                }, 2000);
                
            } catch (error) {
                console.error('Login error:', error);
                let errorMessage = getTranslation('loginFailed');
                
                if (error.code === 'auth/user-not-found') {
                    errorMessage = getTranslation('noAccountFound');
                } else if (error.code === 'auth/wrong-password') {
                    errorMessage = getTranslation('incorrectPassword');
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = getTranslation('invalidEmail');
                } else if (error.code === 'auth/too-many-requests') {
                    errorMessage = getTranslation('tooManyAttempts');
                } else if (error.code === 'auth/invalid-credential') {
                    errorMessage = getTranslation('invalidCredential');
                }
                
                showNotification(errorMessage, 'error');
                setButtonLoading('login-btn', false);
            }
        };

        window.handleRegister = async function(e) {
            e.preventDefault();

            const username = document.getElementById('register-username').value;

                showNotification(getTranslation('passwordsDontMatch'), 'error');

                const user = userCredential.user;
                
                const userData = {
                    email: user.email,
                    uid: user.uid,
                    username: username,
                    phone: phone,
                    inviteCode: inviteCode,
                    isLoggedIn: true,

                };

            e.preventDefault();
            const email = document.getElementById('forgot-email').value;

            setButtonLoading('forgot-btn', true);

            try {
                await sendPasswordResetEmail(auth, email);
                showNotification(`${getTranslation('passwordResetSent')} ${email}`, 'success');
                setTimeout(() => {
                    switchTab('login');
                    setButtonLoading('forgot-btn', false);
                }, 2000);
                
            } catch (error) {
                console.error('Password reset error:', error);
                let errorMessage = getTranslation('passwordResetFailed');
                
                if (error.code === 'auth/user-not-found') {
                    errorMessage = getTranslation('noAccountFound');
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = getTranslation('invalidEmail');
                }
                
                showNotification(errorMessage, 'error');
                setButtonLoading('forgot-btn', false);
            }
        };

        window.switchTab = function(tab) {
            const tabs = document.querySelectorAll('.tab-btn');
            const sections = document.querySelectorAll('.form-section');
            
            tabs.forEach(t => t.classList.remove('active'));
            sections.forEach(s => s.classList.remove('active'));
            
            if (tab === 'login') {
                if (tabs.length > 0) tabs[0].classList.add('active');
                document.getElementById('login-section').classList.add('active');
            } else if (tab === 'register') {
                if (tabs.length > 1) tabs[1].classList.add('active');
                document.getElementById('register-section').classList.add('active');
                const urlParams = new URLSearchParams(window.location.search);
                const inviteCode = urlParams.get('code');
                if (inviteCode) {
                    document.getElementById('invite-code').value = inviteCode;
                }
            } else if (tab === 'forgot') {
                document.getElementById('forgot-section').classList.add('active');
            }
        };

        window.togglePassword = function(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        };

        window.checkPasswordStrength = function(password) {
            const strengthBar = document.getElementById('strength-bar');
            strengthBar.className = 'password-strength-bar';
            
            if (password.length < 6) {
                strengthBar.classList.add('strength-weak');
            } else if (password.length < 10) {
                strengthBar.classList.add('strength-medium');
            } else {
                strengthBar.classList.add('strength-strong');
            }
        };

        window.checkGooglePasswordStrength = function(password) {
            const strengthBar = document.getElementById('google-strength-bar');
            strengthBar.className = 'password-strength-bar';
            
            if (password.length < 6) {
                strengthBar.classList.add('strength-weak');
            } else if (password.length < 10) {
                strengthBar.classList.add('strength-medium');
            } else {
                strengthBar.classList.add('strength-strong');
            }
        };

        window.translations = {
            en: {
                welcomeBack: "Welcome back!",
                accountCreated: "Account created successfully! Welcome",
                passwordsDontMatch: "Passwords do not match!",
                passwordTooShort: "Password must be at least 6 characters long!",
                loginFailed: "Login failed. Please try again.",
                noAccountFound: "No account found with this email.",
                incorrectPassword: "Incorrect password.",
                invalidEmail: "Invalid email address.",
                tooManyAttempts: "Too many attempts. Please try again later.",
                invalidCredential: "Invalid email or password.",
                registrationFailed: "Registration failed. Please try again.",
                emailAlreadyUsed: "This email is already registered.",
                weakPassword: "Password is too weak.",
                googleSignInFailed: "Google sign-in failed. Please try again.",
                popupClosed: "Sign-in popup was closed.",
                signInCancelled: "Sign-in was cancelled.",
                passwordResetSent: "Password reset email sent to",
                passwordResetFailed: "Password reset failed. Please try again.",
                sessionExpired: "Your session has expired. Please login again.",
                welcome: "Welcome"
            }
        };
    </script>
</body>
</html>
